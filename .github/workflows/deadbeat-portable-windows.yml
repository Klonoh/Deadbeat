name: Deadbeat - Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 17 para construir
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Construir EXE con Java integrado
        shell: pwsh
        working-directory: DeadBeat
        run: .\scripts\crear-portable-windows.ps1

      - name: Publicar ZIP portable
        uses: actions/upload-artifact@v4
        with:
          name: Deadbeat-Windows-Portable
          path: DeadBeat/distribucion/Deadbeat-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
